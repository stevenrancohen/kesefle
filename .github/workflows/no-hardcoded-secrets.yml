name: no-hardcoded-secrets
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/test_no_hardcoded_secrets.mjs
      - run: node --no-warnings tests/test_wa_config_mock.mjs && node --no-warnings tests/test_wa_secrets_and_links.mjs
