<script>
'use strict';
// ───────── auth + fetch (same pattern as admin-os/dashboard) ─────────
function token(){ try { return (JSON.parse(localStorage.getItem('kesefle_user')||'{}')).idToken || ''; } catch(e){ return ''; } }
function AuthError(){ var e=new Error('auth'); e.isAuth=true; return e; }
async function apiGet(path){
  var t=token(); var h=t?{Authorization:'Bearer '+t}:{};
  var r=await fetch(path,{credentials:'include',headers:h});
  if(r.status===401||r.status===403) throw AuthError();
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiPost(path,body){
  var t=token(); var h={'Content-Type':'application/json'}; if(t) h.Authorization='Bearer '+t;
  var r=await fetch(path,{method:'POST',credentials:'include',headers:h,body:JSON.stringify(body||{})});
  if(r.status===401||r.status===403) throw AuthError();
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
// ───────── helpers ─────────
var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ if(n==null||isNaN(n)) return '—'; return '₪'+Math.round(Number(n)).toLocaleString('he-IL'); }
function num(n){ if(n==null||isNaN(n)) return '—'; return Number(n).toLocaleString('he-IL'); }
function agoDays(d){ if(!d) return ''; var x=new Date(d); if(isNaN(x.getTime())) return ''; var diff=Math.round((Date.now()-x.getTime())/86400000); if(diff<0) return x.toLocaleDateString('he-IL',{day:'numeric',month:'short'}); if(diff===0) return 'היום'; if(diff===1) return 'אתמול'; if(diff<7) return 'לפני '+diff+' ימים'; return x.toLocaleDateString('he-IL',{day:'numeric',month:'short'}); }
var HEB_MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function thisMonthLabel(){ var d=new Date(); return HEB_MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function daysLeftInMonth(){ var d=new Date(); return Math.max(0,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()); }
function loadingHero(){ return '<div class="card p-5"><div class="skel h-3 w-24"></div><div class="skel mt-3 h-9 w-40"></div><div class="mt-5 grid grid-cols-2 gap-3"><div class="skel h-14"></div><div class="skel h-14"></div></div></div><div class="skel mt-4 h-40 w-full rounded-2xl"></div>'; }
function emptyState(t,sub){ return '<div class="card p-8 text-center"><div class="text-3xl">∅</div><div class="mt-2 text-sm font-semibold">'+esc(t||'אין נתונים עדיין')+'</div>'+(sub?'<div class="mt-1 text-xs text-ink-500">'+esc(sub)+'</div>':'')+'</div>'; }
function signInState(){ return '<div class="card p-8 text-center"><div class="text-3xl">🔒</div><div class="mt-2 text-sm font-semibold">צריך להתחבר</div><div class="mt-1 text-xs text-ink-500">התחבר/י עם חשבון Google כדי לראות את הנתונים שלך.</div><a href="/account?next='+encodeURIComponent(location.pathname+location.hash)+'" class="mt-4 inline-block rounded-xl bg-brand-600 px-5 py-2.5 text-sm font-bold text-white">התחברות</a></div>'; }
function errState(e){ if(e&&e.isAuth) return signInState(); return '<div class="card p-6 text-center text-sm text-red-500">שגיאה בטעינה: '+esc(e&&e.message||e)+'<div class="mt-3"><button onclick="route(true)" class="rounded-xl border border-ink-100 dark:border-ink-700 px-4 py-2 text-xs text-ink-500">נסה שוב</button></div></div>'; }
function bar(label,val,max,tone){ var pct=max>0?Math.round(val/max*100):0; var c=tone||'bg-brand-500'; return '<div class="py-2"><div class="flex items-center justify-between text-sm"><span class="truncate">'+esc(label)+'</span><span class="font-semibold tabular-nums">'+money(val)+'</span></div><div class="mt-1 h-2 overflow-hidden rounded-full bg-ink-100 dark:bg-ink-800"><div class="h-full '+c+'" style="width:'+Math.max(3,pct)+'%"></div></div></div>'; }
// Runtime config is the single source of truth. The fallback is the currently
// deployed number, but /api/config can switch every app surface at cutover.
var WA_LINK='https://wa.me/972547760643';
var APP={prefs:{persona:'single',activeSpace:'personal'},onboarding:{},me:null,group:null,expenses:null,budgets:null};
var PERSONAS={
  single:{label:'אישי / רווק·ה',short:'אישי',desc:'הוצאות, חיסכון ותזרים בלי רעש'},
  employee:{label:'שכיר·ה',short:'שכיר·ה',desc:'משכורת, הוצאות קבועות ומה נשאר'},
  couple:{label:'זוג',short:'זוג',desc:'תמונה משותפת לצד אחריות אישית'},
  family:{label:'משפחה',short:'משפחה',desc:'מי הוציא, תקציב ביתי ושקיפות'},
  freelancer:{label:'עצמאי·ת',short:'עצמאי·ת',desc:'אישי ועסקי בלי לערבב'},
  business:{label:'בעל·ת עסק',short:'עסק',desc:'הכנסות, הוצאות, רווח ותזרים'},
  mixed:{label:'שכיר·ה + עסק',short:'משולב',desc:'מעבר ברור בין הבית לעסק הצדדי'}
};
var SPACE_LABELS={personal:'אישי',household:'זוגי / משפחתי',business:'עסק'};
function activeSpace(){ return APP.prefs.activeSpace||'personal'; }
function currentPersona(){ return PERSONAS[APP.prefs.persona]||PERSONAS.single; }
function storePrefs(){ try{ localStorage.setItem('kfl_ui_prefs',JSON.stringify(APP.prefs)); }catch(_e){} }
async function savePrefs(fields){
  APP.prefs=Object.assign({},APP.prefs,fields||{}); storePrefs(); paintSpaceSwitcher();
  try{ await apiPost('/api/ui-preferences',APP.prefs); }catch(_e){}
}
async function loadPersonalization(){
  try{ APP.prefs=Object.assign(APP.prefs,JSON.parse(localStorage.getItem('kfl_ui_prefs')||'{}')); }catch(_e){}
  var r=await Promise.all([
    apiGet('/api/ui-preferences').catch(function(){return null;}),
    apiGet('/api/me').catch(function(){return null;}),
    apiGet('/api/group/mine').catch(function(){return null;})
  ]);
  if(r[0]&&r[0].ok){ APP.prefs=Object.assign(APP.prefs,r[0].preferences||{}); APP.onboarding=r[0].onboarding||{}; storePrefs(); }
  APP.me=r[1]; APP.group=r[2]&&r[2].group||null;
  paintSpaceSwitcher();
}
function paintSpaceSwitcher(){
  var space=activeSpace();
  document.querySelectorAll('[data-space]').forEach(function(b){ var on=b.getAttribute('data-space')===space; b.classList.toggle('active',on); b.setAttribute('aria-pressed',on?'true':'false'); });
  var fab=$('#expenseFab'); if(fab) fab.href='/expense?from=app&space='+encodeURIComponent(space);
  var who=$('#whoami'); if(who){ var u=APP.me&&APP.me.user, name=u&&(u.name||u.email); who.textContent=(name?name+' · ':'')+currentPersona().short; }
}
function bindSpaceSwitcher(){
  document.querySelectorAll('[data-space]').forEach(function(b){ b.onclick=async function(){ var space=b.getAttribute('data-space'); if(space===activeSpace())return; await savePrefs({activeSpace:space}); route(true); }; });
}
function isBusinessRow(r){
  var text=((r&&r.category)||'')+' '+((r&&r.description)||'');
  return /(עסק|חברה|ecom|שיווק ופרסום|שכר עובדים|קבלן משנה|חומרי גלם|תוכנות וציוד|רואה חשבון|מיסים|משלוחים עסקיים|שכירות משרד|הכנסה מעסק)/i.test(text);
}
function filterRowsForSpace(rows,space){
  rows=(rows||[]).slice(); var persona=APP.prefs.persona;
  if(space==='business'){
    if(persona==='business'||persona==='freelancer') return rows;
    return rows.filter(isBusinessRow);
  }
  if(space==='personal'&&persona==='mixed') return rows.filter(function(r){return !isBusinessRow(r);});
  return rows;
}
function currentMonthRows(rows){ var d=new Date(), key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); return (rows||[]).filter(function(r){return String(r.date||'').slice(0,7)===key;}); }
function calcTotals(rows){ return (rows||[]).reduce(function(a,r){var v=Number(r.amount)||0;if(r.is_income)a.income+=v;else a.expense+=v;a.count++;return a;},{income:0,expense:0,count:0}); }
function calcCategories(rows){ var m={};(rows||[]).forEach(function(r){if(r.is_income)return;var c=r.category||'אחר';m[c]=(m[c]||0)+(Number(r.amount)||0);});return Object.keys(m).map(function(k){return{name:k,total:m[k]};}).sort(function(a,b){return b.total-a.total;}); }
function calcMembers(rows){ var m={};(rows||[]).forEach(function(r){if(r.is_income)return;var n=String(r.member||'').trim();if(!n||/^(true|false|0|1|כן|לא)$/i.test(n))return;m[n]=(m[n]||0)+(Number(r.amount)||0);});return Object.keys(m).map(function(k){return{name:k,total:m[k]};}).sort(function(a,b){return b.total-a.total;}); }
async function loadAppConfig(){

    d=Object.assign({},d,{month_expenses:visibleTotals.expense,month_income:visibleTotals.income,month_count:visibleTotals.count,top_categories:visibleCats.slice(0,7),month_expenses_delta_pct:prevExpense?Math.round((visibleTotals.expense-prevExpense)/prevExpense*100):null});
  }

  var spent=Number(d.month_expenses)||0;
  var tc=(d.top_categories||[]).filter(function(c){return c&&c.name;});
  if(!spent && !tc.length){ view.innerHTML=head+onboardingCard(); return; }

  // End-of-month projection: current pace (spent / days elapsed) x days in month.
  var now=new Date();
  var dayOfMonth=now.getDate();
  var daysInMonth=new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  var projected = dayOfMonth>0 ? Math.round(spent/dayOfMonth*daysInMonth) : spent;
  var leftDays=Math.max(0, daysInMonth-dayOfMonth);
  var projCard='<div class="card hero-card p-5 sm:p-6">'+
    '<div class="text-xs text-white/70">תחזית להוצאות עד סוף החודש</div>'+
    '<div class="mt-1 font-display text-3xl font-black">'+money(projected)+'</div>'+
    '<div class="mt-1 text-xs text-white/70">לפי הקצב הנוכחי · הוצאת '+money(spent)+' ב-'+num(dayOfMonth)+' ימים · עוד '+num(leftDays)+' ימים בחודש</div>'+
  '</div>';

  // Month-over-month vs last month (delta from summary).
  var delta=d.month_expenses_delta_pct;
  var momCard='';
  if(delta!=null){
    var up=delta>0, flat=delta===0;
    var col=flat?'text-ink-500':(up?'text-rose-500':'text-emerald-500');
    var arrow=flat?'→':(up?'▲':'▼');
    momCard='<div class="card mt-3 p-4 flex items-center justify-between">'+
      '<div><div class="text-xs text-ink-500">לעומת החודש שעבר</div>'+
      '<div class="mt-0.5 text-sm text-ink-500">'+(up?'הוצאת יותר':(flat?'אותו דבר':'הוצאת פחות'))+'</div></div>'+
      '<div class="'+col+' font-display text-2xl font-black">'+arrow+' '+Math.abs(delta)+'%</div>'+
    '</div>';
  }

  // Budget progress (only if the user actually set caps). Real caps from
  // /api/budgets; real current-month spend per category from getExpenses.
  var budgetCard='';
  var cats = bg && bg.ok && bg.budget && bg.budget.categories ? bg.budget.categories : null;
  if(cats && Object.keys(cats).length){
    var curKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    var spendByCat={};
    if(ex && ex.rows){ ex.rows.forEach(function(r){ if(r.is_income) return; if(String(r.date).slice(0,7)!==curKey) return; var c=r.category||'אחר'; spendByCat[c]=(spendByCat[c]||0)+(Number(r.amount)||0); }); }
    var rows=Object.keys(cats).map(function(name){
      var cap=Number(cats[name].cap)||0; var th=Number(cats[name].threshold)||80;
      var sp=Number(spendByCat[name])||0; var pct=cap>0?Math.round(sp/cap*100):0;
      var over=cap>0&&sp>cap, warn=!over&&cap>0&&pct>=th;
      var barCol=over?'bg-rose-500':(warn?'bg-amber-500':'bg-emerald-500');
      var txtCol=over?'text-rose-500':(warn?'text-amber-500':'text-ink-500');
      return '<div class="mb-3">'+
        '<div class="mb-1 flex items-center justify-between text-sm"><span class="font-medium">'+esc(name)+'</span>'+
        '<span class="'+txtCol+'">'+money(sp)+' / '+money(cap)+'</span></div>'+
        '<div class="h-2 w-full overflow-hidden rounded-full bg-ink-100 dark:bg-ink-800"><div class="h-full rounded-full '+barCol+'" style="width:'+Math.min(100,pct)+'%"></div></div>'+
        (over?'<div class="mt-0.5 text-[11px] text-rose-500">חרגת מהתקציב ב-'+money(sp-cap)+'</div>':(warn?'<div class="mt-0.5 text-[11px] text-amber-500">'+pct+'% מהתקציב</div>':''))+
      '</div>';
    }).join('');
    budgetCard='<div class="card mt-3 p-4"><div class="mb-3 font-display text-base font-bold">תקציבים החודש</div>'+rows+'</div>';
  }

  // 6-month expense trend from full history (expenses only).
  var trendCard='';
  if(ex && ex.rows && ex.rows.length){
    var byMonth={};
    ex.rows.forEach(function(r){ if(r.is_income) return; var m=String(r.date).slice(0,7); byMonth[m]=(byMonth[m]||0)+(Number(r.amount)||0); });
    var months=[];
    for(var i=5;i>=0;i--){ var dt=new Date(now.getFullYear(), now.getMonth()-i, 1); var key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); months.push({key:key, label:(HEB_MONTHS[dt.getMonth()]||'').slice(0,3), val:byMonth[key]||0}); }
    var maxM=months.reduce(function(m,o){return Math.max(m,o.val);},0);
    if(maxM>0){
      trendCard='<div class="card mt-3 p-4"><div class="mb-3 font-display text-base font-bold">מגמת הוצאות · 6 חודשים</div>'+
        '<div class="flex items-end justify-between gap-1.5" style="height:120px">'+months.map(function(o){
          var h=maxM>0?Math.max(4,Math.round(o.val/maxM*100)):4; var cur=o.key===(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
          return '<div class="flex flex-1 flex-col items-center justify-end gap-1" style="height:100%">'+
            '<div class="w-full rounded-t-lg '+(cur?'bg-brand-500':'bg-brand-500/30')+'" style="height:'+h+'%" title="'+money(o.val)+'"></div>'+
            '<div class="text-[10px] '+(cur?'font-bold text-ink-600 dark:text-ink-300':'text-ink-500')+'">'+esc(o.label)+'</div></div>';
        }).join('')+'</div></div>';
    }
  }

  // Category breakdown.
  var total=tc.reduce(function(s,c){return s+(Number(c.total)||0);},0);
  var catCard='';
  if(tc.length){
    var maxC=tc.reduce(function(m,c){return Math.max(m,Number(c.total)||0);},0);
    catCard='<div class="card mt-3 p-4"><div class="mb-1 font-display text-base font-bold">לאן הלך הכסף החודש</div>'+
      tc.map(function(c){ var p=total>0?Math.round((Number(c.total)||0)/total*100):0; return bar(c.name+' · '+p+'%', Number(c.total)||0, maxC); }).join('')+'</div>';
  }

  view.innerHTML=head+projCard+momCard+budgetCard+trendCard+catCard+
    '<div class="mt-3 text-center text-xs text-ink-500">המספרים מתעדכנים אוטומטית מהגיליון שלך.</div>';
}

// ───────── ACCOUNT ─────────
function isStandalone(){ return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||'') && !window.MSStream; }
function personaChooser(){
  return '<div class="card mt-4 p-5"><div class="flex items-start justify-between gap-3"><div><div class="eyebrow">התאמה אישית</div><div class="mt-1 font-display text-xl font-black">איך הכסף שלך מתנהל?</div><div class="mt-1 text-xs leading-5 text-ink-500">נשנה את סדר העדיפויות והתובנות. הנתונים עצמם לא יימחקו ולא ישתנו.</div></div><span class="rounded-full border border-brand-300/40 bg-brand-50 px-3 py-1 text-xs font-bold text-brand-700">'+esc(currentPersona().short)+'</span></div><div class="mt-4 grid grid-cols-1 gap-2 sm:grid-cols-2">'+
    Object.keys(PERSONAS).map(function(k){var p=PERSONAS[k],on=APP.prefs.persona===k;return '<button data-persona="'+k+'" class="rounded-2xl border p-3 text-right '+(on?'border-brand-300 bg-brand-50 dark:border-brand-700 dark:bg-brand-900/20':'border-ink-100 dark:border-ink-800')+'"><span class="flex items-center justify-between"><strong class="text-sm">'+esc(p.label)+'</strong>'+(on?'<span class="text-brand-700">✓</span>':'')+'</span><span class="mt-1 block text-[11px] leading-5 text-ink-500">'+esc(p.desc)+'</span></button>';}).join('')+
  '</div></div>';
}
async function renderAccount(view){
  var d, link={ok:true,linked:false};
  try { d=await apiGet('/api/me'); } catch(e){ view.innerHTML=errState(e); return; }
  // Phone status is useful but non-critical; a transient rate-limit/network
  // error must not blank the entire account screen.
  try { link=await apiGet('/api/whatsapp/link?check=1')||link; } catch(_e){}
  if(!d||!d.ok||!d.user){ view.innerHTML=errState(AuthError()); return; }
  APP.me=d; paintSpaceSwitcher();
  var u=d.user||{}, sheet=d.sheet||null;
  var initials=(u.name||u.email||'?').trim().charAt(0).toUpperCase();
  var head='<div class="mb-5"><div class="eyebrow">שליטה והתאמה</div><h1 class="font-display text-4xl font-black">החשבון שלי</h1></div>';
  var prof='<div class="card flex items-center gap-3 p-4">'+
    (u.picture?'<img src="'+esc(u.picture)+'" alt="" class="h-12 w-12 rounded-full" referrerpolicy="no-referrer">':'<div class="grid h-12 w-12 place-items-center rounded-full bg-brand-100 font-bold text-brand-700">'+esc(initials)+'</div>')+
    '<div class="min-w-0"><div class="truncate font-semibold">'+esc(u.name||'משתמש/ת כספ\'לה')+'</div><div class="truncate text-xs text-ink-500">'+esc(u.email||'')+'</div></div></div>';
  function rowLink(href,icon,label,sub,ext){ return '<a href="'+esc(href)+'"'+(ext?' target="_blank" rel="noopener"':'')+' class="flex items-center gap-3 px-4 py-3.5"><span class="grid h-9 w-9 place-items-center rounded-xl bg-ink-50 dark:bg-ink-800 text-base">'+icon+'</span><span class="flex-1"><span class="block text-sm font-medium">'+esc(label)+'</span>'+(sub?'<span class="block text-[11px] text-ink-500">'+esc(sub)+'</span>':'')+'</span><span class="text-ink-300">‹</span></a>'; }
  var links='<div class="card mt-4 divide-y divide-ink-100 dark:divide-ink-800">'+
    (sheet&&sheet.spreadsheetUrl?rowLink(sheet.spreadsheetUrl,'📊','הגיליון שלי','פתח/י את הגיליון ב-Google Sheets',true):rowLink('/account','📊','הגדרת גיליון','חבר/י את הגיליון שלך'))+
    (link.linked?rowLink(WA_LINK,'✅','WhatsApp מחובר','המספר המאומת: +'+String(link.phone||''),true):rowLink('/account#step-3','📱','חיבור WhatsApp','אמת/י את המספר ללא SMS בתשלום'))+
    rowLink(WA_LINK,'💬','הבוט בוואטסאפ','רשום/י הוצאה או בקש/י סיכום',true)+
    rowLink(WA_LINK+'?text='+encodeURIComponent('כספלה צור משפחה'),'👥','ניהול זוגי ומשפחתי','יצירת בית והזמנת בני משפחה',true)+
    rowLink('/tax-report','💼','כלים לעצמאים ולעסקים','דוח מס ומע״מ והפרדה עסקית')+
    rowLink('/account','⚙','הגדרות חשבון','תוכנית, קטגוריות, פרטיות')+
    rowLink('/pricing','★','שדרוג ל-Pro','הוצאות ללא הגבלה וניתוחים')+
  '</div>';
  var invite='<button id="inviteBtn" class="card mt-4 flex w-full items-center gap-3 p-4 text-right active:scale-[.99]"><span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-50 dark:bg-brand-900/30 text-base">🎁</span><span class="min-w-0 flex-1"><span class="block text-sm font-medium">הזמן חברים לכספ\'לה</span><span id="inviteSub" class="block text-[11px] text-ink-500">שתף/י קישור — ועזור/י לחברים לעקוב אחרי הכסף</span></span><span class="text-ink-300">‹</span></button>';
  // Install: native prompt on Android/Chrome; manual steps on iOS Safari (which
  // never fires beforeinstallprompt); nothing once already installed (standalone).
  var install;
  if(isStandalone()){ install=''; }
  else if(isIOS()){ install='<div class="card mt-4 p-4"><div class="text-sm font-semibold">📲 התקנה במסך הבית</div><div class="mt-1 text-xs text-ink-500">הקש/י על כפתור השיתוף בתחתית הדפדפן (הריבוע עם החץ ↑), ואז על &rdquo;הוסף למסך הבית&ldquo; / Add to Home Screen.</div></div>'; }
  else { install='<button id="installBtn" class="mt-4 hidden w-full rounded-2xl bg-brand-600 py-3.5 text-sm font-bold text-white">📲 התקן/י את האפליקציה במסך הבית</button>'; }
  var logout='<button onclick="kflLogout()" class="mt-4 w-full rounded-2xl border border-ink-100 dark:border-ink-700 py-3 text-sm font-semibold text-ink-500">התנתקות</button>';
  view.innerHTML=head+'<div class="desktop-grid"><div>'+prof+personaChooser()+'</div><aside>'+links+invite+install+logout+'</aside></div>';
  document.querySelectorAll('[data-persona]').forEach(function(b){ b.onclick=async function(){
    var persona=b.getAttribute('data-persona');
    var space=(persona==='couple'||persona==='family')?'household':((persona==='freelancer'||persona==='business')?'business':'personal');
    await savePrefs({persona:persona,activeSpace:space}); renderAccount(view);
  }; });
  var ib=$('#installBtn'); if(ib&&window.__kflDeferredPrompt){ ib.classList.remove('hidden'); ib.onclick=async function(){ try{ window.__kflDeferredPrompt.prompt(); await window.__kflDeferredPrompt.userChoice; }catch(e){} window.__kflDeferredPrompt=null; ib.classList.add('hidden'); }; }
  // Invite/share: lazily fetch (or generate) the user's referral link only on tap
  // (keeps KV reads off the render path). Web Share API with clipboard fallback.
  var inviteBtn=$('#inviteBtn');
  if(inviteBtn){ inviteBtn.onclick=async function(){
    var sub=$('#inviteSub'); if(sub) sub.textContent='מכין קישור…';
    var url=null;
    try{ var m=await apiGet('/api/referral?action=mine'); url=m&&m.url; }catch(e){}
    if(!url){ try{ var g=await apiPost('/api/referral?action=generate',{}); url=g&&g.url; }catch(e){} }
    if(!url) url='https://kesefle.com';
    var text='אני מנהל/ת את הכסף עם כספ\'לה — בוט וואטסאפ שרושם הוצאות בשנייה. בוא/י תנסה/י:';
    try{
      if(navigator.share){ await navigator.share({title:'כספ\'לה', text:text, url:url}); if(sub) sub.textContent='תודה ששיתפת! 🙏'; }
      else if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text+' '+url); if(sub) sub.textContent='הקישור הועתק ✓'; }
      else { window.open(url,'_blank'); if(sub) sub.textContent='שתף/י קישור — ועזור/י לחברים לעקוב אחרי הכסף'; }
    }catch(e){ if(sub) sub.textContent='שתף/י קישור — ועזור/י לחברים לעקוב אחרי הכסף'; }
  }; }
}
async function kflLogout(){
  try{ await fetch('/api/auth/logout',{method:'POST',credentials:'include'}); }catch(e){}
  try{ localStorage.removeItem('kesefle_user'); }catch(e){}
  // Purge cached per-user API responses so a different account on the same device
  // can't read the previous user's financial data from the SW cache (audit 2026-06-19).
  try{ if(window.caches&&caches.keys){ var ks=await caches.keys(); await Promise.all(ks.filter(function(k){return /kesefle-api/.test(k);}).map(function(k){return caches.delete(k);})); } }catch(e){}
  location.href='/account';
}

// ───────── theme + PWA + boot ─────────
function applyTheme(t){ document.documentElement.classList.toggle('dark', t==='dark'); var m=document.querySelector('meta[name=theme-color]'); if(m) m.content=(t==='dark'?'#090a0d':'#f7f7f5'); }
function toggleTheme(){ var t=document.documentElement.classList.contains('dark')?'light':'dark'; localStorage.setItem('kfl_app_theme',t); applyTheme(t); }
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__kflDeferredPrompt=e; var ib=$('#installBtn'); if(ib){ ib.classList.remove('hidden'); ib.onclick=async function(){ try{ e.prompt(); await e.userChoice; }catch(_){} window.__kflDeferredPrompt=null; ib.classList.add('hidden'); }; } });
(async function(){
  applyTheme(localStorage.getItem('kfl_app_theme') || 'dark');
  try { var u=JSON.parse(localStorage.getItem('kesefle_user')||'{}'); if(u&&(u.name||u.email)) $('#whoami').textContent=u.name||u.email; } catch(e){}
  buildTabs();
  bindSpaceSwitcher();
  paintSpaceSwitcher();
  $('#themeBtn').onclick=toggleTheme;
  $('#refreshBtn').onclick=function(){ route(true); };
  window.addEventListener('hashchange', function(){ route(); });
  if(!location.hash) location.hash='#/';
  await Promise.all([loadAppConfig(),loadPersonalization()]);
  route();
  if('serviceWorker' in navigator){ try { navigator.serviceWorker.register('/sw.js'); } catch(e){} }
  // Pull-to-refresh: only when scrolled to the very top; passive listeners so it
  // never fights native scroll. Triggers a real re-fetch via route(true).
  (function ptr(){
    var startY=0, pulling=false, THRESH=70, ind=null;
    function getInd(){ if(!ind){ ind=document.createElement('div'); ind.id='ptrInd'; ind.style.cssText='position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;padding-top:68px;pointer-events:none;z-index:40;opacity:0;transition:opacity .15s'; ind.innerHTML='<div style="color:#fff;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:700">↓ רענון</div>'; document.body.appendChild(ind); } return ind; }
    window.addEventListener('touchstart',function(e){ pulling = (window.scrollY<=0 && e.touches && e.touches.length===1); if(pulling) startY=e.touches[0].clientY; }, {passive:true});
    window.addEventListener('touchmove',function(e){ if(!pulling) return; var dy=e.touches[0].clientY-startY; if(dy>10 && window.scrollY<=0){ var i=getInd(); i.style.opacity=Math.min(1,dy/THRESH); i.firstChild.textContent= dy>=THRESH?'שחרר לרענון':'↓ רענון'; } else if(ind){ ind.style.opacity=0; } }, {passive:true});
    window.addEventListener('touchend',function(e){ if(!pulling) return; var ey=(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientY:startY; var dy=ey-startY; if(ind) ind.style.opacity=0; if(dy>=THRESH && window.scrollY<=0){ route(true); } pulling=false; }, {passive:true});
  })();
})();
</script>
