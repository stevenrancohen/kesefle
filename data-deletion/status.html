<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>סטטוס בקשת מחיקה | Deletion status — כספ'לה</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/css/brand.css" />
<style>body{font-family:Heebo,Arial,sans-serif;max-width:640px;margin:40px auto;padding:0 18px;line-height:1.7}#s{padding:14px;border-radius:10px;background:#f4f4f4}</style>
</head>
<body>
<h1>סטטוס בקשת מחיקת נתונים <small dir="ltr">/ Deletion request status</small></h1>
<form id="f"><label>קוד אישור / Confirmation code: <input id="id" dir="ltr" required pattern="KDEL[0-9A-F]{16}" /></label> <button>בדיקה / Check</button></form>
<p id="s">—</p>
<script>
(function(){
  var L={
    received_pending_identity_verification:'הבקשה נשמרה וממתינה לאימות זהות לפני מחיקה. / Request saved; identity verification is required before deletion.',
    processing:'המחיקה מתבצעת כעת. / Deletion is in progress.',
    completed:'המחיקה הושלמה. / Deletion completed.',
    failed_retrying:'אירעה תקלה זמנית; המערכת תנסה שוב. / Temporary failure; the system will retry.'
  };
  var s=document.getElementById('s'), inp=document.getElementById('id');
  function check(id){
    s.textContent='…';
    fetch('/api/meta/data-deletion?id='+encodeURIComponent(id)).then(function(r){return r.json().then(function(j){return {status:r.status,body:j};});}).then(function(x){
      var j=x.body;
      if(j && j.ok){ s.textContent='#'+j.id+' — '+(L[j.status]||j.status); return; }
      s.textContent = x.status===503 ? 'הסטטוס אינו זמין זמנית / Status temporarily unavailable' : 'הבקשה לא נמצאה / Request not found';
    }).catch(function(){ s.textContent='שגיאה, נסו שוב / Error, try again'; });
  }
  var q=new URLSearchParams(location.search).get('id'); if(q){ inp.value=q; check(q); }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();check(inp.value.trim());});
})();
</script>
</body>
</html>
